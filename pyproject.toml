[project]
name = "llm-dojo"
version = "0.1.0"
description = "Hands-on patterns for production LLM systems: agents, structured reasoning, serving, RAG, evals"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[tool.uv]
package = false
